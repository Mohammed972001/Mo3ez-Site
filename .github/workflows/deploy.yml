# Lint -> build -> deploy to Cloudflare Workers (OpenNext) on every push to main.
# Public repo, so Actions minutes are free; still one Linux job, docs-only pushes
# skipped, older runs cancelled and a hard timeout. The build is the type-check.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - "docs/**"
      - "design-reference/**"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm run lint

      - run: npm run deploy
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Public value: the Search Console meta tag rendered in every page head.
          NEXT_PUBLIC_GSC_VERIFICATION: Hg-eu7GtZqduPoK6FDitUgThwJJZptg0cQxxHJsgGEQ
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
